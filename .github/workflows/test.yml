name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile plugins/generate-transparent-image/skills/generate-transparent-image/scripts/recover_alpha.py
      - run: python -m unittest discover -s plugins/generate-transparent-image/skills/generate-transparent-image/tests -v
